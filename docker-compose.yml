version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: itsm-postgres
    environment:
      POSTGRES_USER: itsm_user
      POSTGRES_PASSWORD: itsm_password
      POSTGRES_DB: itsm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - itsm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./itsm-microservices
      dockerfile: Dockerfile
    container_name: itsm-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://itsm_user:itsm_password@db:5432/itsm_db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itsm-network
    restart: unless-stopped
    volumes:
      - ./itsm-microservices:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itsm-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - itsm-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  itsm-network:
    driver: bridge
